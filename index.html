<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tell Party · Ligações</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ok:#16a34a;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1d2127;--tx:#eceef1;--mut:#9aa3af;--bd:#2d333b;--ac:#5b8def;--ok:#34d399;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1d2127;--tx:#eceef1;--mut:#9aa3af;--bd:#2d333b;--ac:#5b8def;--ok:#34d399;--bad:#f87171;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tabs button{flex:1 1 auto;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.add input,.add select{flex:1 1 150px}
button.p{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.g{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:none;color:var(--mut);font:inherit;font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{flex:1 1 140px;font-weight:600;cursor:pointer;background:none;border:0;color:var(--tx);text-align:left;font:inherit;font-weight:600;padding:4px 0}
.nm small{display:block;font-weight:400;color:var(--mut)}
.badge{background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:13px;color:var(--mut)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.det{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);font-size:14px}
.det ul{margin:6px 0 0;padding-left:0;list-style:none}
.det li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd)}
.det li button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
textarea{display:block;width:100%;min-height:90px;margin-top:10px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:15px;resize:both;max-width:100%}
label.ck{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut);margin-top:8px;cursor:pointer}
label.ck input{width:auto}
.fld{display:grid;gap:8px;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ok);color:var(--ok);border-radius:99px;padding:3px 6px 3px 10px;font-size:14px;cursor:pointer}
.chip.busy{border-color:var(--bd);color:var(--mut);text-decoration:line-through}
.chip b{font-weight:400;color:var(--bad);padding:0 4px}
.dayctl{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.dayctl input{flex:1}
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.ch{background:var(--ok);color:var(--bg);text-align:center;font-weight:700;font-size:clamp(9px,2.4vw,14px);padding:6px 0;border-radius:6px}
.cd{min-height:76px;border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:4px 5px;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cd b{font-size:clamp(11px,3vw,16px)}
.cd .tm{margin-top:4px}
.cd i{display:block;font-style:normal;font-size:clamp(9px,2.4vw,12px);color:var(--ok);line-height:1.3}
.cd.has{background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.cd.today{outline:2px solid var(--ac)}
.cd.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.cd.blank{background:none;border:0;cursor:default}
a{color:var(--ac);text-decoration:none}
.hidden{display:none}
.hidden{display:none!important}
.cc{display:inline-block;border:1px solid var(--bd);border-radius:99px;padding:2px 9px;font-size:13px;color:var(--mut)}
#login{min-height:85vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:28px 24px;display:grid;gap:12px}
.logo{display:block;margin:0 auto;width:120px;height:auto}
.logo.sm{width:38px;margin:0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .logo{filter:brightness(0) invert(1)}
.err{font-size:14px;min-height:18px;text-align:center}
.top{display:flex;align-items:center;gap:10px}
.top h1{flex:1}
</style>
</head>
<body>
<div id="boot" class="empty" style="padding:60px 0">Carregando…</div>

<div id="login" class="hidden">
  <div class="lcard">
    <img class="logo" alt="W1">
    <div style="text-align:center"><b style="font-size:18px">Tell Party</b><div class="sub" style="margin:2px 0 0">Entre para acessar suas ligações</div></div>
    <input id="lem" type="email" placeholder="E-mail" autocomplete="username">
    <input id="lpw" type="password" placeholder="Senha" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="p" id="lin">Entrar</button>
    <button class="g" id="lup">Criar conta</button>
    <button class="g" id="lrs" style="border:0">Esqueci a senha</button>
  </div>
</div>

<main id="app" class="hidden">
  <div class="top"><img class="logo sm" alt="W1"><h1>Tell Party · Ligações</h1><button class="g" id="out">Sair</button></div>
  <div class="sub"><span id="today"></span> · <span id="who"></span> · <span id="sync"></span></div>
  <div class="tabs">
    <button id="t1" class="on">Lista do dia</button>
    <button id="t2">Histórico</button>
    <button id="t3">Anotações</button>
    <button id="t4">Análises</button>
    <button id="t5">Agenda</button>
  </div>

  <section id="v1">
    <div class="dayctl"><button class="g" id="dprev">‹</button><input type="date" id="sd"><button class="g" id="dnext">›</button><button class="g" id="dtoday">Hoje</button></div>
    <div class="row" style="margin-bottom:10px"><button class="g" id="cpb">Copiar lista</button></div>
    <div id="cpp" class="card hidden"></div>
    <div class="card add">
      <input id="n" placeholder="Nome">
      <input id="p" placeholder="Telefone" inputmode="tel">
      <button class="p" id="addb">Adicionar</button>
    </div>
    <div id="l1"></div>
  </section>

  <section id="v2" class="hidden">
    <div class="card"><input id="q" placeholder="Buscar nome…" style="width:100%"></div>
    <div id="l2"></div>
  </section>

  <section id="v3" class="hidden">
    <div class="card"><input id="q3" placeholder="Buscar nome…" style="width:100%"></div>
    <div id="l3"></div>
  </section>

  <section id="v4" class="hidden">
    <div class="card add"><select id="asel"></select><button class="p" id="aadd">Agendar análise</button></div>
    <div id="l4"></div>
  </section>

  <section id="v5" class="hidden">
    <div class="dayctl"><button class="p" id="mprev" title="Mês anterior">‹</button><input type="month" id="mpick"><button class="p" id="mnext" title="Próximo mês">›</button><button class="g" id="mtoday">Mês atual</button><span id="mlabel" style="display:none"></span></div>
    <div id="l5"></div>
  </section>
</main>

  }
  function startApp(u){
    uid=u.uid; ready=false;
    uref=fdb.ref("users/"+uid+"/tellparty");
    var l=lsGet(); S=(l&&l.people)?l:{people:[]};
    show("app"); $("who").textContent=u.email||""; setSync("Sincronizando…"); render();
    uref.once("value").then(function(snap){
      var v=snap.val();
      if(v&&v.json){var r=JSON.parse(v.json);if(r&&r.people){S=r;lsSet()}}
      ready=true;
      if(!(v&&v.json)) save(); else setSync("Salvo na nuvem ✓");
      render();
    }).catch(function(e){
      setSync("Não foi possível carregar seus dados ("+(e.code||e.message)+"). Recarregue a página.",true);
    });
  }
  function errMsg(e){
    var m={
      "auth/invalid-email":"E-mail inválido.",
      "auth/missing-password":"Digite a senha.",
      "auth/missing-email":"Digite o e-mail.",
      "auth/invalid-credential":"E-mail ou senha incorretos.",
      "auth/wrong-password":"E-mail ou senha incorretos.",
      "auth/user-not-found":"E-mail ou senha incorretos.",
      "auth/email-already-in-use":"Este e-mail já tem conta. Use Entrar.",
      "auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.",
      "auth/too-many-requests":"Muitas tentativas. Aguarde um pouco.",
      "auth/network-request-failed":"Sem conexão com a internet.",
      "auth/operation-not-allowed":"Login por e-mail/senha não está ativado no Firebase (Authentication > Método de login).",
      "auth/unauthorized-domain":"Este endereço não está autorizado no Firebase (Authentication > Configurações > Domínios autorizados)."
    };
    return m[e.code]||("Erro: "+(e.code||e.message));
  }
  function lerr(t,ok){var el=$("lerr");el.textContent=t||"";el.style.color=ok?"var(--ok)":"var(--bad)"}
  function boot(){
    Array.prototype.forEach.call(document.querySelectorAll("img.logo"),function(i){i.src=LOGO});
    if(!window.firebase){show("login");lerr("Não foi possível carregar o Firebase. Verifique a conexão.");return}
    firebase.initializeApp(firebaseConfig);
    auth=firebase.auth(); fdb=firebase.database();
    $("lin").onclick=function(){lerr("");auth.signInWithEmailAndPassword($("lem").value.trim(),$("lpw").value).catch(function(e){lerr(errMsg(e))})};
    $("lup").onclick=function(){lerr("");auth.createUserWithEmailAndPassword($("lem").value.trim(),$("lpw").value).catch(function(e){lerr(errMsg(e))})};
    $("lrs").onclick=function(){
      var em=$("lem").value.trim(); if(!em){lerr("Digite seu e-mail acima.");return}
      auth.sendPasswordResetEmail(em).then(function(){lerr("Enviamos um e-mail para redefinir a senha.",true)}).catch(function(e){lerr(errMsg(e))});
    };
    $("lpw").addEventListener("keydown",function(e){if(e.key==="Enter")$("lin").click()});
    $("out").onclick=function(){auth.signOut()};
    auth.onAuthStateChanged(function(u){
      if(u){startApp(u)}
      else{uref=null;uid=null;ready=false;S={people:[]};open={};$("lpw").value="";show("login")}
    });
  }

  // ---- copiar lista de outro dia
  var cpOpen=false, cpMsg="";
  function renderCp(){
    var el=$("cpp"); if(!cpOpen){el.classList.add("hidden");return}
    var by={}; S.people.forEach(function(p){(by[p.day]=by[p.day]||[]).push(p)});
    var days=Object.keys(by).sort().reverse();
    var h='<div class="row" style="justify-content:space-between"><b>Copiar a lista de qual dia para '+fmtD(sel).slice(0,5)+'?</b><button class="g" data-cpx="1">Fechar</button></div>';
    if(cpMsg) h+='<div class="sub" style="margin:8px 0 0;color:var(--ok)">'+esc(cpMsg)+'</div>';
    if(!days.length) h+='<div class="empty">Nenhum dia com contatos ainda.</div>';
    days.forEach(function(d){
      var a=d.split("-"), n=by[d].length, wd=new Date(+a[0],+a[1]-1,+a[2]).toLocaleDateString("pt-BR",{weekday:"short"});
      h+='<div class="row" style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd)"><div style="flex:1 1 120px"><b>'+a[2]+'/'+a[1]+'/'+a[0]+'</b> · '+wd+'<div class="sub" style="margin:0">'+n+(n===1?' contato':' contatos')+'</div></div>'+
        (d!==sel?'<button class="p" data-cpb="'+d+'">Copiar para '+fmtD(sel).slice(0,5)+'</button>':'<span class="badge">dia aberto</span>')+'</div>';
    });
    el.innerHTML=h; el.classList.remove("hidden");
  }

  // ---- actions
  function addPerson(){
    var n=$("n").value.trim(), p=$("p").value.trim();
    if(!n) return;
    S.people.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,phone:p,day:sel,calls:[]});
    $("n").value="";$("p").value="";$("n").focus();
    save();render();
  }
  function find(id){return S.people.filter(function(x){return x.id===id})[0]}
  function logCall(id){
    var p=find(id), t=$("t_"+id).value||nowT();
    p.calls.push({d:dayStr(),t:t});
    p.calls.sort(function(a,b){return (a.d+a.t)<(b.d+b.t)?-1:1});
    open[id]=true; save();render();
  }
  var adia=null;
  function ag(){return S.agenda||(S.agenda={})}
  function release(p){
    var a=p.an;
    if(a&&a.dt&&a.res){
      var k=a.dt.slice(0,10), t=a.dt.slice(11,16), r=ag()[k]=ag()[k]||[];
      if(!r.some(function(x){return x.t===t})) r.push({t:t,busy:false});
      r.sort(function(x,y){return x.t<y.t?-1:1});
    }
    if(a){a.dt="";a.res=false}
  }
  function pick(id,t){
    var p=find(id), a=p&&p.an; if(!a||!a.pd) return;
    release(p);
    ag()[a.pd]=(ag()[a.pd]||[]).filter(function(x){return x.t!==t});
    a.dt=a.pd+"T"+t; a.res=true;
    save();render();
  }
  function schedHtml(p){
    var a=p.an;
    if(a.dt) return '<div class="row"><span class="badge ok">Agendada: '+fmtDT(a.dt)+'</span><button class="g" data-unsch="'+p.id+'">Desmarcar horário</button></div>';
    var free=(ag()[a.pd]||[]).filter(function(x){return !x.busy});
    var h='<label class="ck" style="margin:0">Dia da análise</label><input type="date" data-andate="'+p.id+'" value="'+ea(a.pd)+'">';
    if(a.pd) h+=free.length?'<div class="sub" style="margin:0">Toque no horário para agendar:</div><div class="chips" style="margin:0">'+free.map(function(x){return '<span class="chip" data-pick="'+p.id+'|'+x.t+'">'+x.t+'</span>'}).join("")+'</div>':'<div class="sub" style="margin:0">Sem horários livres neste dia. Adicione na aba Agenda.</div>';
    return h;
  }
  function shift(s,n){var a=s.split("-");return dayStr(new Date(+a[0],+a[1]-1,+a[2]+n))}
  function ea(s){return esc(s||"").replace(/"/g,"&quot;")}
  function fmtDT(v){return v?fmtD(v.slice(0,10))+" às "+v.slice(11,16):""}
  function twice(k,fn){if(!pend[k]){pend[k]=1;setTimeout(function(){if(pend[k]){delete pend[k];render()}},4000);return}delete pend[k];fn()}
  function addTime(key){
    var el=document.querySelector('[data-at="'+key+'"]'); if(!el||!el.value) return;
    var a=ag()[key]=ag()[key]||[];
    if(!a.some(function(x){return x.t===el.value})) a.push({t:el.value,busy:false});
    a.sort(function(x,y){return x.t<y.t?-1:1});
    save();render();
    var n=document.querySelector('[data-at="'+key+'"]'); if(n) n.focus();
  }
  function anFields(p){
    var a=p.an,i=' data-id="'+p.id+'" ';
    return '<div class="fld"><input'+i+'data-an="nome" placeholder="Nome completo" value="'+ea(a.nome)+'">'+
      '<input'+i+'data-an="email" type="email" placeholder="E-mail" value="'+ea(a.email)+'">'+
      schedHtml(p)+
      '<textarea'+i+'data-an="info" placeholder="Informações obtidas na análise…" style="margin-top:0">'+esc(a.info||"")+'</textarea>'+
      '<button class="g" data-unan="'+p.id+'">'+(pend["a"+p.id]?'Confirmar remoção?':'Remover da lista de análises')+'</button></div>';
  }
  function delCall(id,i){find(id).calls.splice(i,1);save();render()}
  function delPerson(id){
    var go=false;twice("p"+id,function(){go=true});if(!go){render();return}
    var rp=find(id);if(rp&&rp.an)release(rp);
    if(rp&&rp.notes){var o=S.people.filter(function(q){return q.id!==id&&pkey(q)===pkey(rp)})[0];if(o&&!o.notes)o.notes=rp.notes}
    S.people=S.people.filter(function(x){return x.id!==id});save();render();
  }

  // ---- render
  function pkey(p){var d=(p.phone||"").replace(/\D/g,"");return d?"t"+d:"i"+p.id}
  function uniq(list){
    var m={},order=[];
    list.forEach(function(p){var k=pkey(p);if(!m[k]){m[k]=p;order.push(k)}else if(!m[k].notes&&p.notes)m[k]=p});
    return order.map(function(k){return m[k]});
  }
  function anKeys(){var o={};S.people.forEach(function(p){if(p.an)o[pkey(p)]=1});return o}
  function callChips(p){
    if(!p.calls.length) return '';
    var rev=p.calls.slice().reverse(), sh=rev.slice(0,4);
    return '<div class="chips" style="margin-top:8px">'+sh.map(function(c){return '<span class="cc">'+fmtD(c.d).slice(0,5)+' às '+esc(c.t)+'</span>'}).join("")+
      (rev.length>4?'<span class="cc">+'+(rev.length-4)+' anteriores</span>':'')+'</div>';
  }
  function details(p){
    if(!p.calls.length) return '<div class="det">Nenhuma ligação registrada ainda.</div>';
    var h='<div class="det"><b>'+p.calls.length+' ligaç'+(p.calls.length===1?'ão':'ões')+'</b><ul>';
    p.calls.forEach(function(c,i){
      h+='<li><span>'+fmtD(c.d)+' às '+esc(c.t)+'</span><button data-del="'+p.id+':'+i+'" title="Apagar registro">apagar</button></li>';
    });
    return h+'</ul></div>';
  }
  function nameBtn(p){
    return '<button class="nm" data-tg="'+p.id+'">'+esc(p.name)+'<small>'+(p.phone?'<a href="tel:'+esc(p.phone.replace(/[^\d+]/g,""))+'">'+esc(p.phone)+'</a>':'sem telefone')+'</small></button>';
  }
  function render(){
    $("today").textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
    var td=dayStr(), h=""; $("sd").value=sel;
    var list=S.people.filter(function(p){return p.day===sel});
    if(!list.length) h='<div class="empty">Nenhum contato neste dia.<br>Adicione nome e telefone acima.</div>';
    list.forEach(function(p){
      var tc=p.calls.filter(function(c){return c.d===td}).length;
      h+='<div class="card"><div class="row">'+nameBtn(p)+
        '<span class="badge'+(tc?' ok':'')+'">'+(tc?tc+'× hoje':'não ligou')+'</span>'+
        '<input type="time" id="t_'+p.id+'" value="'+nowT()+'" style="width:110px">'+
        '<button class="p" data-call="'+p.id+'">Liguei</button>'+
        '<button class="g" data-rm="'+p.id+'">'+(pend["p"+p.id]?'Apagar?':'✕')+'</button></div>'+'<label class="ck"><input type="checkbox" data-rec="'+p.id+'"'+(p.rec?' checked':'')+'> Falei com o recomendador (reesquentar contato)</label>'+
        (open[p.id]?details(p):callChips(p))+'</div>';
    });
    $("l1").innerHTML=h;

    var q=$("q").value.trim().toLowerCase(), h2="";
    var hist=S.people.filter(function(p){return p.calls.length&&(!q||p.name.toLowerCase().indexOf(q)>-1)});
    hist.sort(function(a,b){return a.name.localeCompare(b.name)});
    if(!hist.length) h2='<div class="empty">Nenhuma ligação registrada ainda.</div>';
    hist.forEach(function(p){
      h2+='<div class="card"><div class="row">'+nameBtn(p)+'<span class="badge ok">'+p.calls.length+'× ligações</span></div>'+(open["h"+p.id]?details(p):callChips(p))+'</div>';
    });
    $("l2").innerHTML=h2;

    var q3=$("q3").value.trim().toLowerCase(), h3="";
    var all=uniq(S.people).filter(function(p){return !q3||p.name.toLowerCase().indexOf(q3)>-1});
    all.sort(function(a,b){return a.name.localeCompare(b.name)});
    if(!all.length) h3='<div class="empty">Nenhuma pessoa cadastrada ainda.</div>';
    all.forEach(function(p){
      h3+='<div class="card"><div class="row">'+nameBtn(p)+(p.notes?'<span class="badge ok">com anotação</span>':'')+'</div>'+
        (open["n"+p.id]?'<textarea data-note="'+p.id+'" placeholder="Informações sobre esta pessoa…">'+esc(p.notes||"")+'</textarea>':'')+'</div>';
    });
    $("l3").innerHTML=h3;

    var opts="";
    uniq(S.people.filter(function(p){return !anKeys()[pkey(p)]})).sort(function(a,b){return a.name.localeCompare(b.name)}).forEach(function(p){opts+='<option value="'+p.id+'">'+esc(p.name)+'</option>'});
    $("asel").innerHTML=opts||'<option value="">Nenhuma pessoa disponível</option>';
    var an=S.people.filter(function(p){return p.an}), h4="";
    an.sort(function(a,b){return (a.an.dt||"9")<(b.an.dt||"9")?-1:1});
    if(!an.length) h4='<div class="empty">Nenhuma análise agendada.<br>Escolha uma pessoa acima.</div>';
    an.forEach(function(p){
      h4+='<div class="card"><div class="row">'+nameBtn(p)+'<span class="badge ok">'+(p.an.dt?fmtDT(p.an.dt):'agendada')+'</span></div>'+(open["a"+p.id]?anFields(p):'')+'</div>';
    });
    $("l4").innerHTML=h4;

    var y=mon.getFullYear(), m=mon.getMonth(), nd=new Date(y,m+1,0).getDate(), h5="", mk=y+"-"+pad(m+1);
    $("mlabel").textContent=mon.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}); $("mpick").value=mk;
    h5='<div class="cal">'+["Segunda","Terça","Quarta","Quinta","Sexta","Sábado"].map(function(x){return '<div class="ch">'+x+'</div>'}).join("");
    var first=true;
    for(var d=1;d<=nd;d++){
      var wd=new Date(y,m,d).getDay(); if(wd===0) continue;
      if(first){first=false;for(var bl=1;bl<wd;bl++) h5+='<div class="cd blank"></div>'}
      var key=mk+"-"+pad(d), arr=ag()[key]||[], free=arr.filter(function(x){return !x.busy}).length;
      h5+='<div class="cd'+(free?' has':'')+(key===td?' today':'')+(key===adia?' sel':'')+'" data-day="'+key+'"><b>'+d+'</b>'+(free?'<div class="tm">'+arr.filter(function(x){return !x.busy}).slice(0,4).map(function(x){return '<i>'+x.t+'</i>'}).join("")+(free>4?'<i>+'+(free-4)+' mais</i>':'')+'</div>':'')+'</div>';
    }
    h5+='</div>';
    if(!adia) adia=td;
    if(adia.slice(0,7)===mk){
      var ar=ag()[adia]||[], ap=adia.split("-"), aw=new Date(+ap[0],+ap[1]-1,+ap[2]).toLocaleDateString("pt-BR",{weekday:"long"});
      h5+='<div class="card" style="margin-top:12px"><b>'+ap[2]+'/'+ap[1]+' · '+aw+'</b>'+
        '<div class="chips">'+ar.map(function(x,i){return '<span class="chip'+(x.busy?' busy':'')+'" data-tog="'+adia+'|'+i+'">'+x.t+'<b data-rmt="'+adia+'|'+i+'">×</b></span>'}).join("")+'</div>'+
        (ar.length?'<div class="sub" style="margin:6px 0 0">Toque no horário para marcar como ocupado.</div>':'<div class="sub" style="margin:6px 0 0">Nenhum horário cadastrado neste dia.</div>')+
        '<div class="row" style="margin-top:10px"><input type="time" data-at="'+adia+'" style="width:130px"><button class="p" data-addt="'+adia+'">Adicionar</button></div></div>';
    } else h5+='<div class="empty">Toque em um dia para ver e incluir horários.</div>';
    $("l5").innerHTML=h5;
    renderCp();
  }

  document.addEventListener("click",function(e){
    var t=e.target;
    if(t.closest("a")) return;
    var b=t.closest("[data-tg]");
    if(b){var id=b.getAttribute("data-tg"),k=tab===1?id:tab===2?"h"+id:tab===3?"n"+id:"a"+id;open[k]=!open[k];render();return}
    if(t.getAttribute("data-call")) return logCall(t.getAttribute("data-call"));
    if(t.getAttribute("data-rm")) return delPerson(t.getAttribute("data-rm"));
    if(t.getAttribute("data-del")){var a=t.getAttribute("data-del").split(":");return delCall(a[0],+a[1])}
  });
  function setTab(n){
    tab=n;
    $("v1").classList.toggle("hidden",n!==1);$("v2").classList.toggle("hidden",n!==2);$("v3").classList.toggle("hidden",n!==3);$("v4").classList.toggle("hidden",n!==4);$("v5").classList.toggle("hidden",n!==5);
    $("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2);$("t3").classList.toggle("on",n===3);$("t4").classList.toggle("on",n===4);$("t5").classList.toggle("on",n===5);
    render();
  }
  $("t1").onclick=function(){setTab(1)};
  $("t2").onclick=function(){setTab(2)};
  $("t3").onclick=function(){setTab(3)};
  $("t4").onclick=function(){setTab(4)};
  $("t5").onclick=function(){setTab(5)};
  $("sd").onchange=function(){if(this.value){sel=this.value;render()}};
  $("dprev").onclick=function(){sel=shift(sel,-1);render()};
  $("dnext").onclick=function(){sel=shift(sel,1);render()};
  $("dtoday").onclick=function(){sel=dayStr();render()};
  $("cpb").onclick=function(){cpOpen=!cpOpen;cpMsg="";render()};
  document.addEventListener("click",function(e){
    var t=e.target,k;
    if(!t.getAttribute) return;
    if(t.getAttribute("data-cpx")){cpOpen=false;render();return}
    if(k=t.getAttribute("data-cpb")){
      var n=0;
      S.people.filter(function(p){return p.day===k}).forEach(function(p){
        var dup=S.people.some(function(q){return q.day===sel&&q.name===p.name&&q.phone===p.phone});
        if(!dup){S.people.push({id:Date.now().toString(36)+n+Math.random().toString(36).slice(2,5),name:p.name,phone:p.phone,day:sel,calls:[]});n++}
      });
      cpMsg=n?n+(n===1?" contato copiado":" contatos copiados")+" para "+fmtD(sel).slice(0,5)+".":"Esses contatos já estão neste dia.";
      save();render();
    }
  });
  $("mprev").onclick=function(){mon=new Date(mon.getFullYear(),mon.getMonth()-1,1);render()};
  $("mnext").onclick=function(){mon=new Date(mon.getFullYear(),mon.getMonth()+1,1);render()};
  $("mpick").onchange=function(){if(this.value){var a=this.value.split("-");mon=new Date(+a[0],+a[1]-1,1);render()}};
  $("mtoday").onclick=function(){var d=new Date();mon=new Date(d.getFullYear(),d.getMonth(),1);adia=dayStr();render()};
  $("aadd").onclick=function(){var p=find($("asel").value);if(!p)return;p.an={nome:p.name,email:"",dt:"",info:""};open["a"+p.id]=true;save();render()};
  document.addEventListener("click",function(e){
    var t=e.target,k,a;
    if(k=t.getAttribute("data-rmt")){a=k.split("|");ag()[a[0]].splice(+a[1],1);save();render();return}
    var c=t.closest("[data-tog]");
    if(c){a=c.getAttribute("data-tog").split("|");var it=ag()[a[0]][+a[1]];it.busy=!it.busy;save();render();return}
    if(k=t.getAttribute("data-pick")){a=k.split("|");pick(a[0],a[1]);return}
    if(k=t.getAttribute("data-unsch")){var pp=find(k);if(pp&&pp.an){release(pp);save();render()}return}
    if(k=t.getAttribute("data-addt")){addTime(k);return}
    var d=t.closest("[data-day]");
    if(d){adia=d.getAttribute("data-day");render();return}
    if(k=t.getAttribute("data-unan")){twice("a"+k,function(){release(find(k));delete find(k).an;save()});render();return}
  });
  document.addEventListener("change",function(e){
    var r=e.target.getAttribute&&e.target.getAttribute("data-rec");
    if(r){var p=find(r);if(p){p.rec=e.target.checked;save()}}
    var dd=e.target.getAttribute&&e.target.getAttribute("data-andate");
    if(dd){var q=find(dd);if(q&&q.an){q.an.pd=e.target.value;save();render()}}
  });
  document.addEventListener("input",function(e){
    var f=e.target.getAttribute&&e.target.getAttribute("data-an");
    if(f){var p=find(e.target.getAttribute("data-id"));if(p&&p.an){p.an[f]=e.target.value;clearTimeout(tm);tm=setTimeout(save,500)}}
  });
  document.addEventListener("keydown",function(e){
    var k=e.target.getAttribute&&e.target.getAttribute("data-at");
    if(k&&e.key==="Enter")addTime(k);
  });
  $("q3").addEventListener("input",render);
  var tm;
  document.addEventListener("input",function(e){
    var id=e.target.getAttribute&&e.target.getAttribute("data-note");
    if(id){var p=find(id);if(p){p.notes=e.target.value;clearTimeout(tm);tm=setTimeout(save,500)}}
  });
  $("addb").onclick=addPerson;
  $("p").addEventListener("keydown",function(e){if(e.key==="Enter")addPerson()});
  $("n").addEventListener("keydown",function(e){if(e.key==="Enter")$("p").focus()});
  $("q").addEventListener("input",render);
  boot();
})();
</script>
</body>
</html>
